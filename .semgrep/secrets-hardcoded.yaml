rules:
  - id: hardcoded-stripe-key
    pattern-either:
      - pattern: '"sk_test_...'
      - pattern: '"sk_live_...'
      - pattern: '"whsec_...'
      - pattern: "'sk_test_..."
      - pattern: "'sk_live_..."
      - pattern: "'whsec_..."
    message: Hardcoded Stripe secret key - use environment variable
    languages: [typescript]
    severity: ERROR

  - id: hardcoded-bearer-token-comparison
    pattern-either:
      - pattern: $REQ.headers.get("authorization") !== "Bearer $TOKEN"
      - pattern: $REQ.headers.get("authorization") != "Bearer $TOKEN"
      - pattern: $REQ.headers.get("Authorization") !== "Bearer $TOKEN"
      - pattern: $REQ.headers.get("Authorization") != "Bearer $TOKEN"
    message: Hardcoded bearer token comparison - use environment variable
    languages: [typescript]
    severity: ERROR

  - id: hardcoded-password-comparison
    pattern-either:
      - pattern: |
          $VAL !== "Bearer " + process.env.$VAR
      - pattern: |
          $VAL !== `Bearer ${process.env.$VAR}`
    message: Insecure bearer token comparison uses !== which is not constant-time
    languages: [typescript]
    severity: WARNING
