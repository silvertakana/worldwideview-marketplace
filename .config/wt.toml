[[pre-start]]
install_deps = "pnpm install"

[[pre-start]]
copy_env = """powershell -Command "if (Test-Path '../worldwideview-marketplace/.env') { Copy-Item '../worldwideview-marketplace/.env' '.env' -Force }; if (Test-Path '../worldwideview-marketplace/.env.local') { Copy-Item '../worldwideview-marketplace/.env.local' '.env.local' -Force }""""

[[pre-remove]]
docker_clean = "docker info > /dev/null 2>&1 && docker compose down -v || true"
