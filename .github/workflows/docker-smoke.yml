name: Docker Smoke Test

on:
  push:
    paths:
      - ".github/workflows/docker-smoke.yml"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "prisma/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/docker-smoke.yml"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "prisma/**"
      - "src/**"

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t marketplace-smoke .

      - name: Smoke test — entrypoint completes
        run: |
          # Clean up any leftover container from a previous run on this runner.
          docker rm -f smoke-test 2>/dev/null || true

          docker run -d --name smoke-test -p 3000:3000 marketplace-smoke

          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is healthy!"
              docker logs smoke-test
              docker stop smoke-test
              docker rm smoke-test
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in 30s"
          docker logs smoke-test
          docker stop smoke-test
          docker rm smoke-test
          exit 1
