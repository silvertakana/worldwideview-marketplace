name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '*.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.event.action != 'closed'
    # A called workflow may only keep or reduce the caller's GITHUB_TOKEN
    # permissions, never elevate them. shared-docker.yml declares
    # contents/packages/id-token/attestations/security-events at job level, so
    # the caller must grant at least the same set; otherwise the run aborts as a
    # startup_failure with zero jobs and no log.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: silvertakana/worldwideview/.github/workflows/shared-docker.yml@main
    with:
      tags: |
        type=ref,event=pr
        type=sha,prefix=sha-
      smoke-test-path: /
      is-preview: true
    secrets: inherit

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cleanup
        run: echo "PR #${{ github.event.number }} closed, image cleanup pending"
