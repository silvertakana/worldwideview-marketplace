name: Mutation Testing

# Mutation testing is expensive (a full run re-runs large parts of the suite once per
# mutant), so we don't gate every PR on it. Instead it runs weekly so we catch drift in
# test quality, and on demand via workflow_dispatch when someone wants to validate a
# specific change.
on:
  schedule:
    # 03:00 UTC Monday = 10 PM US Eastern Sunday night.
    - cron: '0 3 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: file:./prisma/registry.db
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for Stryker's incremental mode.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      # Without this the incremental report is written fresh every week, and every
      # weekly run re-tests all mutants instead of only the ones that changed.
      - name: Restore Stryker incremental report
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref }}-
      - run: pnpm exec stryker run
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30
